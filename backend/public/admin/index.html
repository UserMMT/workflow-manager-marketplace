<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marketplace — Modération</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Marketplace Kibish Approbation <span class="topbar-sub">Modération</span></h1>
    <div id="user-bar" class="user-bar" hidden>
      <span id="user-info"></span>
      <button id="logout-btn" class="btn btn-ghost">Déconnexion</button>
    </div>
  </header>

  <main>
    <section id="login-view" class="login-view">
      <form id="login-form" class="card login-card">
        <h2>Connexion</h2>
        <p class="hint">Compte admin, collaborator ou maintainer.</p>
        <label>Email
          <input type="email" id="login-email" required autocomplete="username">
        </label>
        <label>Mot de passe
          <input type="password" id="login-password" required autocomplete="current-password">
        </label>
        <button type="submit" class="btn btn-primary">Se connecter</button>
        <p id="login-error" class="error" hidden></p>
      </form>
    </section>

    <section id="app-view" hidden>
      <nav class="tabs">
        <button data-tab="pending" class="tab active">En attente</button>
        <button data-tab="approved" class="tab">Approuvés</button>
        <button data-tab="rejected" class="tab">Rejetés</button>
        <button data-tab="users" class="tab" id="users-tab" hidden>Comptes</button>
      </nav>

      <section id="catalog-panel">
        <p id="catalog-empty" class="hint" hidden>Aucun item.</p>
        <div id="catalog-list" class="entry-list"></div>
        <div id="catalog-pagination" class="pagination" hidden>
          <button id="prev-catalog-page" class="btn btn-ghost btn-sm">← Précédent</button>
          <span id="catalog-page-info" class="hint"></span>
          <button id="next-catalog-page" class="btn btn-ghost btn-sm">Suivant →</button>
        </div>
      </section>

      <section id="users-panel" hidden>
        <div class="card">
          <h2>Comptes</h2>
          <div id="users-list" class="user-list"></div>
        </div>

        <form id="create-user-form" class="card">
          <h3>Créer un compte</h3>
          <label>Nom
            <input type="text" id="new-user-name" required>
          </label>
          <label>Email
            <input type="email" id="new-user-email" required>
          </label>
          <label>Mot de passe
            <input type="password" id="new-user-password" required minlength="8">
          </label>
          <label>Rôle
            <select id="new-user-role">
              <option value="maintainer">maintainer</option>
              <option value="collaborator">collaborator</option>
              <option value="admin">admin</option>
            </select>
          </label>
          <button type="submit" class="btn btn-primary">Créer le compte</button>
          <p id="create-user-error" class="error" hidden></p>
          <p id="create-user-success" class="success" hidden></p>
        </form>
      </section>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
